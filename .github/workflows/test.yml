name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcjson-dev
      - name: System cJSON
        run: make && make test
      - name: Vendored cJSON
        run: make clean && make HAVE_SYSTEM_CJSON=no && make HAVE_SYSTEM_CJSON=no test

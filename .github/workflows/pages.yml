name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "i18n/**"
      - "tools/i18n.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs for the same ref
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The translated pages must come from the current English page and translations.
      # On a mismatch the job stops here and the last good version stays live.
      - name: Refuse stale translations
        run: python3 tools/i18n.py check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Every version served right: 200s, /es -> /es/, lang, title, canonical, hreflang
      - name: Verify the live languages
        run: |
          for i in 1 2 3 4 5; do
            python3 tools/i18n.py verify "${{ steps.deployment.outputs.page_url }}" && exit 0
            sleep 30
          done
          exit 1

      # Tell Bing, Yandex, Naver, Seznam and the other IndexNow engines what changed.
      # The key is public by design (served at /<key>.txt); Google and Baidu read the sitemap instead.
      - name: IndexNow
        env:
          INDEXNOW_KEY: 29551045540d2bb471f4a188d4f7fa47
        run: python3 tools/searchreg.py indexnow submit https://subzeroclaw.com --urls-from-sitemap
